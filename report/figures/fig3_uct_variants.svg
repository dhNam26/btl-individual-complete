<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330">
<style>
  text { font-family: "Times New Roman", Georgia, serif; fill: #1e293b; }
  .title { font-size: 13.5px; font-weight: bold; }
  .axis-label { font-size: 11.5px; font-weight: bold; }
  .tick { font-size: 10px; fill: #334155; }
  .legend { font-size: 10px; }
  .val { font-size: 9.5px; font-weight: bold; }
</style>
<rect width="680" height="330" fill="#ffffff"/>
<text x="340.0" y="22" text-anchor="middle" class="title">UCT Selection Formula Ablation &amp; Improvements (Gomoku 5-in-a-Row, 500 Iterations)</text>
<line x1="235.0" y1="42" x2="235.0" y2="284" stroke="#e2e8f0"/>
<text x="235.0" y="301" text-anchor="middle" class="tick">0%</text>
<line x1="313.0" y1="42" x2="313.0" y2="284" stroke="#e2e8f0"/>
<text x="313.0" y="301" text-anchor="middle" class="tick">20%</text>
<line x1="391.0" y1="42" x2="391.0" y2="284" stroke="#e2e8f0"/>
<text x="391.0" y="301" text-anchor="middle" class="tick">40%</text>
<line x1="469.0" y1="42" x2="469.0" y2="284" stroke="#e2e8f0"/>
<text x="469.0" y="301" text-anchor="middle" class="tick">60%</text>
<line x1="547.0" y1="42" x2="547.0" y2="284" stroke="#e2e8f0"/>
<text x="547.0" y="301" text-anchor="middle" class="tick">80%</text>
<line x1="625.0" y1="42" x2="625.0" y2="284" stroke="#e2e8f0"/>
<text x="625.0" y="301" text-anchor="middle" class="tick">100%</text>
<line x1="235" y1="42" x2="235" y2="284" stroke="#1e293b" stroke-width="1.3"/>
<line x1="235" y1="284" x2="625" y2="284" stroke="#1e293b" stroke-width="1.3"/>
<text x="430.0" y="320" text-anchor="middle" class="axis-label">Win Rate (% over 50 alternating games)</text>
<rect x="235" y="48.6" width="171.6" height="21.4" fill="#94a3b8" rx="2"/>
<text x="227" y="62.8" text-anchor="end" class="tick">Greedy (c=0, W/N)</text>
<text x="412.6" y="62.8" class="val">44.0%</text>
<rect x="235" y="83.1" width="195.0" height="21.4" fill="#d97706" rx="2"/>
<text x="227" y="97.4" text-anchor="end" class="tick">Linear (W/N + c/N)</text>
<text x="436.0" y="97.4" class="val">50.0%</text>
<rect x="235" y="117.7" width="195.0" height="21.4" fill="#dc2626" rx="2"/>
<text x="227" y="131.9" text-anchor="end" class="tick">No-Ln (W/N + c*sqrt(1/N))</text>
<text x="436.0" y="131.9" class="val">50.0%</text>
<rect x="235" y="152.3" width="62.4" height="21.4" fill="#ea580c" rx="2"/>
<text x="227" y="166.5" text-anchor="end" class="tick">No-Sqrt (W/N + c*ln(Np)/N)</text>
<text x="303.4" y="166.5" class="val">16.0%</text>
<rect x="235" y="186.9" width="109.2" height="21.4" fill="#1f4e79" rx="2"/>
<text x="227" y="201.1" text-anchor="end" class="tick">Standard UCT</text>
<text x="350.2" y="201.1" class="val">28.0%</text>
<rect x="235" y="221.4" width="163.8" height="21.4" fill="#008080" rx="2"/>
<text x="227" y="235.6" text-anchor="end" class="tick">UCB1-Tuned (Variance-aware)</text>
<text x="404.8" y="235.6" class="val">42.0%</text>
<rect x="235" y="256.0" width="382.2" height="21.4" fill="#1b9e77" rx="2"/>
<text x="227" y="270.2" text-anchor="end" class="tick">PUCT (Heuristic Prior)</text>
<text x="623.2" y="270.2" class="val">98.0%</text>
</svg>